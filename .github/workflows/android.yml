name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew if present
        run: chmod +x ./gradlew || true

      - name: Generate CI Debug & Release Keystores
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" || true
          keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK with Gradle
        run: gradle assembleRelease --stacktrace
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-fm-tuner-apks
          path: app/build/outputs/apk/**/*.apk
